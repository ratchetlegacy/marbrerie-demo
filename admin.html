<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Espace atelier — SARL Gravure Lafargue</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Lato:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--ivory:#FBF8F2;--paper:#F3EDE2;--line:#E4DAC8;--ink:#1B1A18;--muted:#6A6358;--gold:#A47C3B;--gold-d:#86632B;--gold-l:#D9B86C;--red:#A3352B;--green:#2F7A4B;--serif:'Cormorant Garamond',Georgia,serif;--sans:'Lato',system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--ivory);color:var(--ink);font:16px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer}
h1,h2,h3{font-family:var(--serif);font-weight:600;margin:0;line-height:1.1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:999px;border:0;font-weight:700;font-size:15px;text-decoration:none;color:var(--ink)}
.btn-gold{background:var(--gold);color:#fff}.btn-gold:hover{background:var(--gold-d)}
.btn-line{background:#fff;border:1.5px solid var(--line)}
.btn-red{background:#fff;border:1.5px solid #E7C3BE;color:var(--red)}
.btn-green{background:var(--green);color:#fff}
.btn-sm{min-height:40px;padding:0 14px;font-size:14px}
/* Login */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:#16181C}
.login form{width:100%;max-width:380px;background:var(--ivory);border-radius:20px;padding:30px;display:flex;flex-direction:column;gap:14px;text-align:center;border:2px solid var(--gold-l)}
.login img{width:100%;max-width:280px;margin:0 auto;mix-blend-mode:multiply}
.login h1{font-size:30px}
.hint{font-size:14px;color:var(--muted);margin:0}
/* Layout */
.top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line)}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 16px;max-width:900px;margin:0 auto}
.topbar img{height:42px;mix-blend-mode:multiply}
.topbar .links{display:flex;gap:6px}
.tabs{display:flex;max-width:900px;margin:0 auto;padding:0 8px}
.tabs button{flex:1;background:none;border:0;border-bottom:3px solid transparent;padding:12px 6px;font-weight:700;font-size:15px;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:7px}
.tabs button.on{color:var(--ink);border-color:var(--gold)}
.badge{background:var(--red);color:#fff;border-radius:999px;font-size:12px;min-width:22px;height:22px;display:inline-grid;place-items:center;padding:0 6px}
main{max-width:900px;margin:0 auto;padding:22px 16px 80px}
.intro{color:var(--muted);margin:6px 0 20px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-weight:700;font-size:14px}
.field small{color:var(--muted);font-size:13px}
input[type=text],input[type=tel],input[type=email],textarea{font:16px var(--sans);padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--ivory);width:100%;color:var(--ink)}
input:focus,textarea:focus{outline:none;border-color:var(--gold);background:#fff}
.toggle{display:flex;align-items:center;gap:12px;font-weight:700;cursor:pointer;margin-bottom:12px}
.toggle input{display:none}
.toggle .sw{width:50px;height:30px;border-radius:999px;background:#D5CDBF;position:relative;transition:.2s;flex:0 0 auto}
.toggle .sw:after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.toggle input:checked+.sw{background:var(--green)}
.toggle input:checked+.sw:after{left:23px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{padding:9px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--ivory);font-size:15px}
.chips button.on{border-color:var(--gold);background:#FBF1DD;font-weight:700}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(120px);background:var(--ink);color:#fff;padding:12px 20px;border-radius:999px;font-weight:700;transition:.3s;z-index:50;white-space:nowrap}
.toast.show{transform:translateX(-50%) translateY(0)}
/* Demandes */
.dem{border-left:5px solid var(--gold)}
.dem.traitee{border-left-color:#C9C1B3;opacity:.75}
.dem-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:8px}
.dem-h h3{font-size:24px}
.dem-h .when{font-size:13px;color:var(--muted);text-align:right;white-space:nowrap}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 10px}
.tags span{background:var(--paper);border-radius:999px;padding:4px 11px;font-size:13px;font-weight:700}
.dem p{margin:0 0 6px;font-size:15px}
.dem .msg{background:var(--ivory);border-radius:10px;padding:10px 12px;margin:8px 0 12px;font-style:italic}
.dem .ph{width:110px;height:110px;object-fit:cover;border-radius:10px;margin:4px 0 12px;cursor:zoom-in}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.st{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:3px 9px;border-radius:999px;background:#FBE3DF;color:var(--red);display:inline-block;margin-bottom:4px}
.traitee .st{background:#E3EFE6;color:var(--green)}
.seg{display:flex;gap:6px;margin-bottom:16px}
.seg button{padding:8px 14px;border-radius:999px;border:1.5px solid var(--line);background:#fff;font-size:14px;font-weight:700}
.seg button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
/* Galerie */
.gl{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.gi{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.gi img{width:100%;aspect-ratio:4/3;object-fit:cover;background:#ddd}
.gi .b{padding:12px 14px;display:flex;flex-direction:column;gap:8px;flex:1}
.gi .t{font-weight:700;line-height:1.3}
.gi .c{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold-d);font-weight:700}
.gi .row{display:flex;gap:6px;margin-top:auto}
.gi .row button{flex:1;min-height:40px;padding:0 6px}
.add{border:2px dashed var(--gold-l);background:#FFFCF5;border-radius:14px;min-height:220px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--gold-d);font-weight:700;font-size:16px;width:100%}
/* Fenêtre */
.modal{position:fixed;inset:0;background:rgba(15,15,18,.6);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--ivory);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:22px 18px 26px}
@media(min-width:700px){.modal{align-items:center}.sheet{border-radius:20px}}
.sheet h2{font-size:28px;margin-bottom:14px}
.pick{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;border:2px dashed var(--gold-l);border-radius:14px;background:#fff;min-height:180px;cursor:pointer;overflow:hidden;margin-bottom:14px;color:var(--gold-d);font-weight:700}
.pick img{width:100%;max-height:300px;object-fit:contain}
.pick input{display:none}
.sheet .foot{display:flex;gap:10px;margin-top:6px}
.sheet .foot .btn{flex:1}
.err{color:var(--red);font-weight:700;font-size:14px;margin:0 0 10px}
.demo{margin-top:30px;text-align:center;font-size:13px;color:var(--muted)}
.demo button{background:none;border:0;color:var(--gold-d);text-decoration:underline;font-size:13px}
@media(max-width:560px){.topbar .links .btn{padding:0 11px}.tabs button{font-size:14px}}
</style>
</head>

<div id="app"></div>
<div class="toast" id="toast"></div>
<script>
/* Données partagées site + espace atelier (démo : stockées dans le navigateur) */
var LFG=(function(){
var KG='lfg-demo-galerie-v1',KI='lfg-demo-info-v1',KD='lfg-demo-devis-v2';
var CATS={gravure:'Gravure',portrait:'Portrait',redorure:'Redorure',entretien:'Entretien'};
var NEEDS={gravure:'Gravure d’inscription',portrait:'Portrait sur granit',redorure:'Redorure des lettres',entretien:'Entretien de sépulture'};
var INFO_DEF={annonceOn:false,annonce:'L’atelier sera fermé du 23 décembre au 2 janvier. Bonnes fêtes !',tel:'06 00 00 00 00',email:'contact@gravure-lafargue.fr',zone:'[Commune du siège] et alentours, dans tous les cimetières',dispo:'Du lundi au vendredi, 8h – 18h'};
var GAL_DEF=[
 {id:'g1',img:'builtin:res',titre:'Ajout d’un nom sur une plaque existante',cat:'gravure'},
 {id:'g2',img:'builtin:e8',titre:'Pose de la feuille d’or',cat:'redorure'},
 {id:'g3',img:'builtin:e6',titre:'Gravure par sablage',cat:'gravure'},
 {id:'g4',img:'builtin:e7',titre:'Mise en peinture des lettres',cat:'redorure'}
];
function dayStr(off,h,m){var d=new Date();d.setDate(d.getDate()-off);d.setHours(h,m,0,0);return d.toISOString();}
var DEV_DEF=[
 {id:'d1',date:dayStr(0,9,12),needs:['gravure'],ville:'Vouvant',civ:'Mme',nom:'Morin',tel:'06 12 34 56 78',email:'',msg:'Ajout du nom de mon père sous celui de ma mère, même style de lettres.',photo:'',statut:'nouvelle'},
 {id:'d2',date:dayStr(1,17,40),needs:['redorure','entretien'],ville:'La Châtaigneraie',civ:'M.',nom:'Bonnet',tel:'06 98 76 54 32',email:'g.bonnet@exemple.fr',msg:'Les lettres sont très effacées, et un nettoyage serait bien avant la Toussaint.',photo:'',statut:'nouvelle'},
 {id:'d3',date:dayStr(5,11,5),needs:['portrait'],ville:'Fontenay-le-Comte',civ:'Mme',nom:'Roy',tel:'07 11 22 33 44',email:'',msg:'Portrait de mon mari à partir d’une photo de mariage.',photo:'',statut:'traitee'}
];
function get(k,def){try{var v=localStorage.getItem(k);return v?JSON.parse(v):def;}catch(e){return def;}}
function put(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true;}catch(e){return false;}}
function clone(o){return JSON.parse(JSON.stringify(o));}
return {
 CATS:CATS,NEEDS:NEEDS,
 info:function(){var i=get(KI,null)||{};var d=clone(INFO_DEF);for(var k in i)d[k]=i[k];return d;},
 saveInfo:function(i){return put(KI,i);},
 galerie:function(){return get(KG,null)||clone(GAL_DEF);},
 saveGalerie:function(g){return put(KG,g);},
 devis:function(){return get(KD,null)||clone(DEV_DEF);},
 saveDevis:function(d){return put(KD,d);},
 src:function(it,B){return it.img.indexOf('builtin:')===0?(B[it.img.slice(8)]||''):it.img;},
 telHref:function(t){var n=(t||'').replace(/[^\d+]/g,'');if(n.charAt(0)==='0')n='+33'+n.slice(1);return 'tel:'+n;},
 esc:function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});},
 resize:function(file,max,q,cb){var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){var s=Math.min(1,max/Math.max(im.width,im.height));var c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',q));};im.src=r.result;};r.readAsDataURL(file);},
 reset:function(){try{localStorage.removeItem(KG);localStorage.removeItem(KI);localStorage.removeItem(KD);}catch(e){}}
};
})();

</script>

var A={tab:'demandes',filtre:'nouvelle',logged:false};
try{A.logged=sessionStorage.getItem('lfg-demo-login')==='1';}catch(e){}
var app=document.getElementById('app'),esc=LFG.esc;
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(function(){t.classList.remove('show')},2200);}
function fmt(iso){var d=new Date(iso),n=new Date(),y=new Date();y.setDate(n.getDate()-1);var h=d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
  if(d.toDateString()===n.toDateString())return 'Aujourd’hui, '+h;if(d.toDateString()===y.toDateString())return 'Hier, '+h;
  return d.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'})+', '+h;}

function render(){
  if(!A.logged){
    app.innerHTML='<div class="login"><form id="login"><img src="'+LOGO+'" alt="SARL Gravure Lafargue"><h1>Espace atelier</h1>'+
    '<div class="field" style="text-align:left"><label for="l-pw">Mot de passe</label><input id="l-pw" type="password" autocomplete="current-password"></div>'+
    '<button class="btn btn-gold" type="submit">Se connecter</button><p class="hint">Démo : n’importe quel mot de passe fonctionne.</p></form></div>';
    return;
  }
  var D=LFG.devis(),nb=D.filter(function(d){return d.statut==='nouvelle'}).length;
  var h='<div class="top"><div class="topbar"><img src="'+LOGO+'" alt="Gravure Lafargue"><div class="links">'+
    '<a class="btn btn-line btn-sm" href="index.html" target="_blank"><span>Voir le site</span></a><button class="btn btn-line btn-sm" data-a="logout"><span>Quitter</span></button></div></div>'+
    '<nav class="tabs"><button data-tab="demandes" class="'+(A.tab==='demandes'?'on':'')+'">Demandes'+(nb?' <span class="badge">'+nb+'</span>':'')+'</button>'+
    '<button data-tab="galerie" class="'+(A.tab==='galerie'?'on':'')+'">Galerie</button>'+
    '<button data-tab="infos" class="'+(A.tab==='infos'?'on':'')+'">Infos</button></nav></div><main>';
  if(A.tab==='demandes')h+=vDemandes(D);
  if(A.tab==='galerie')h+=vGalerie();
  if(A.tab==='infos')h+=vInfos();
  h+='<p class="demo">Version de démonstration. <button data-a="reset">Remettre la démo à zéro</button></p></main>';
  app.innerHTML=h;
}

function vDemandes(D){
  var L=D.filter(function(d){return d.statut===A.filtre});
  var h='<h2 style="font-size:32px">Demandes de devis</h2><p class="intro">Les demandes envoyées depuis le site arrivent ici.</p>'+
    '<div class="seg"><button data-filtre="nouvelle" class="'+(A.filtre==='nouvelle'?'on':'')+'">À traiter</button><button data-filtre="traitee" class="'+(A.filtre==='traitee'?'on':'')+'">Traitées</button></div>';
  if(!L.length)h+='<div class="card empty">'+(A.filtre==='nouvelle'?'Aucune nouvelle demande pour le moment.':'Aucune demande traitée.')+'</div>';
  L.forEach(function(d){
    h+='<div class="card dem '+d.statut+'"><div class="dem-h"><div><span class="st">'+(d.statut==='nouvelle'?'À traiter':'Traitée')+'</span><h3>'+esc((d.civ?d.civ+' ':'')+d.nom)+'</h3></div><span class="when">'+fmt(d.date)+'</span></div>'+
    '<div class="tags">'+d.needs.map(function(n){return '<span>'+esc(LFG.NEEDS[n]||n)+'</span>'}).join('')+'</div>'+
    '<p>📍 Cimetière de <b>'+esc(d.ville)+'</b></p><p>📞 '+esc(d.tel)+(d.email?' · ✉️ '+esc(d.email):'')+'</p>'+
    (d.msg?'<div class="msg">« '+esc(d.msg)+' »</div>':'')+
    (d.photo?'<img class="ph" src="'+d.photo+'" alt="Photo du monument" data-a="zoom">':'')+
    '<div class="actions"><a class="btn btn-gold btn-sm" href="'+LFG.telHref(d.tel)+'">📞 Appeler</a><button class="btn btn-line btn-sm" data-a="sms" data-id="'+d.id+'">💬 SMS</button>'+
    (d.statut==='nouvelle'?'<button class="btn btn-green btn-sm" data-a="done" data-id="'+d.id+'">✓ Traitée</button>':'<button class="btn btn-line btn-sm" data-a="undo" data-id="'+d.id+'">↩ À traiter</button>')+
    '<button class="btn btn-red btn-sm" data-a="deldem" data-id="'+d.id+'">Supprimer</button></div></div>';
  });
  return h;
}

function vGalerie(){
  var G=LFG.galerie();
  var h='<h2 style="font-size:32px">Galerie</h2><p class="intro">Les photos visibles dans « Nos réalisations » sur le site. La première est affichée en premier.</p><div class="gl">'+
    '<button class="add" data-a="addphoto"><span style="font-size:34px">＋</span>Ajouter une photo</button>';
  G.forEach(function(it,i){
    h+='<div class="gi"><img src="'+LFG.src(it,B)+'" alt=""><div class="b"><span class="c">'+LFG.CATS[it.cat]+'</span><span class="t">'+esc(it.titre)+'</span>'+
    '<div class="row"><button class="btn btn-line" data-a="up" data-i="'+i+'" '+(i===0?'disabled style="opacity:.35"':'')+' aria-label="Monter">↑</button>'+
    '<button class="btn btn-line" data-a="editphoto" data-i="'+i+'">Modifier</button><button class="btn btn-red" data-a="delphoto" data-i="'+i+'">Suppr.</button></div></div></div>';
  });
  return h+'</div>';
}

function vInfos(){
  var I=LFG.info();
  return '<h2 style="font-size:32px">Infos de l’atelier</h2><p class="intro">Modifiez puis appuyez sur « Enregistrer » : le site est mis à jour tout de suite.</p>'+
  '<div class="card"><label class="toggle"><input type="checkbox" id="i-on" '+(I.annonceOn?'checked':'')+'><span class="sw"></span>Afficher un message en haut du site</label>'+
  '<div class="field"><label for="i-ann">Message</label><textarea id="i-ann" rows="2">'+esc(I.annonce)+'</textarea><small>Ex. : fermeture pour congés, délais avant la Toussaint…</small></div></div>'+
  '<div class="card"><div class="field"><label for="i-tel">Téléphone</label><input type="tel" id="i-tel" value="'+esc(I.tel)+'"></div>'+
  '<div class="field"><label for="i-dispo">Disponibilités</label><input type="text" id="i-dispo" value="'+esc(I.dispo)+'"></div>'+
  '<div class="field"><label for="i-mail">E-mail</label><input type="email" id="i-mail" value="'+esc(I.email)+'"></div>'+
  '<div class="field" style="margin:0"><label for="i-zone">Zone d’intervention</label><input type="text" id="i-zone" value="'+esc(I.zone)+'"></div></div>'+
  '<button class="btn btn-gold" style="width:100%" data-a="saveinfo">Enregistrer</button>';
}

/* Fenêtre ajout / modification de photo */
var E=null;
function sheet(){
  var m=document.createElement('div');m.className='modal';m.id='modal';
  var cats=Object.keys(LFG.CATS).map(function(k){return '<button type="button" data-cat="'+k+'" class="'+(E.cat===k?'on':'')+'">'+LFG.CATS[k]+'</button>'}).join('');
  m.innerHTML='<div class="sheet"><h2>'+(E.i<0?'Nouvelle photo':'Modifier la photo')+'</h2>'+
  '<label class="pick" id="pick"><input type="file" accept="image/*" id="f-file">'+(E.img?'<img src="'+(E.img.indexOf('builtin:')===0?B[E.img.slice(8)]:E.img)+'" alt="">':'<span style="font-size:34px">📷</span>Prendre ou choisir une photo')+'</label>'+
  '<div class="field"><label for="f-t">Légende</label><input type="text" id="f-t" maxlength="70" value="'+esc(E.titre)+'" placeholder="Ex. : Redorure d’une stèle en granit noir"></div>'+
  '<div class="field"><label>Catégorie</label><div class="chips" id="f-cat">'+cats+'</div></div>'+
  '<p class="err" id="f-err" hidden></p>'+
  '<div class="foot"><button class="btn btn-line" data-a="close">Annuler</button><button class="btn btn-gold" data-a="savephoto">'+(E.i<0?'Ajouter':'Enregistrer')+'</button></div></div>';
  document.body.appendChild(m);
  m.querySelector('#f-file').onchange=function(){var f=this.files[0];if(!f)return;LFG.resize(f,1400,.8,function(u){E.img=u;var p=document.getElementById('pick');p.querySelectorAll('img,span').forEach(function(x){x.remove()});var im=document.createElement('img');im.src=u;p.appendChild(im);});};
  m.querySelector('#f-cat').onclick=function(e){var b=e.target.closest('button');if(!b)return;E.cat=b.dataset.cat;this.querySelectorAll('button').forEach(function(x){x.classList.toggle('on',x===b)})};
  m.addEventListener('click',function(e){if(e.target===m)closeSheet()});
}
function closeSheet(){var m=document.getElementById('modal');if(m)m.remove();E=null;}

document.addEventListener('submit',function(e){e.preventDefault();if(e.target.id==='login'){A.logged=true;try{sessionStorage.setItem('lfg-demo-login','1')}catch(x){}render();}});
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-tab],[data-filtre],[data-a]');if(!t)return;
  if(t.dataset.tab){A.tab=t.dataset.tab;render();window.scrollTo(0,0);return}
  if(t.dataset.filtre){A.filtre=t.dataset.filtre;render();return}
  var a=t.dataset.a,D,G,i;
  switch(a){
  case 'logout':A.logged=false;try{sessionStorage.removeItem('lfg-demo-login')}catch(x){}render();break;
  case 'reset':if(confirm('Remettre toute la démo à zéro ?')){LFG.reset();render();toast('Démo remise à zéro')}break;
  case 'done':case 'undo':D=LFG.devis();D.forEach(function(d){if(d.id===t.dataset.id)d.statut=a==='done'?'traitee':'nouvelle'});LFG.saveDevis(D);render();toast(a==='done'?'Demande classée « traitée »':'Demande remise « à traiter »');break;
  case 'deldem':if(confirm('Supprimer définitivement cette demande ?')){D=LFG.devis().filter(function(d){return d.id!==t.dataset.id});LFG.saveDevis(D);render();toast('Demande supprimée')}break;
  case 'sms':D=LFG.devis().filter(function(d){return d.id===t.dataset.id})[0];var qui=D.civ?D.civ.replace('M.','Monsieur').replace('Mme','Madame')+' '+D.nom:D.nom;
    var txt='Bonjour '+qui+', ici SARL Gravure Lafargue. Merci pour votre demande de devis pour le cimetière de '+D.ville+'. Je vous propose de passer voir le monument. Quand êtes-vous disponible ?';
    window.location.href='sms:'+(D.tel||'').replace(/\s/g,'')+'?&body='+encodeURIComponent(txt);break;
  case 'zoom':window.open(t.src,'_blank');break;
  case 'addphoto':E={i:-1,img:'',titre:'',cat:'gravure'};sheet();break;
  case 'editphoto':G=LFG.galerie();i=+t.dataset.i;E={i:i,img:G[i].img,titre:G[i].titre,cat:G[i].cat};sheet();break;
  case 'close':closeSheet();break;
  case 'savephoto':
    var err=document.getElementById('f-err'),titre=document.getElementById('f-t').value.trim();
    if(!E.img){err.textContent='Ajoutez une photo.';err.hidden=false;break}
    if(!titre){err.textContent='Ajoutez une légende.';err.hidden=false;break}
    G=LFG.galerie();var it={id:E.i<0?'g'+Date.now():G[E.i].id,img:E.img,titre:titre,cat:E.cat};
    if(E.i<0)G.unshift(it);else G[E.i]=it;
    if(!LFG.saveGalerie(G)){err.textContent='Mémoire de la démo pleine : supprimez une photo (la version finale n’a pas cette limite).';err.hidden=false;break}
    var nouv=E.i<0;closeSheet();render();toast(nouv?'Photo ajoutée au site':'Photo modifiée');break;
  case 'delphoto':if(confirm('Retirer cette photo du site ?')){G=LFG.galerie();G.splice(+t.dataset.i,1);LFG.saveGalerie(G);render();toast('Photo retirée')}break;
  case 'up':G=LFG.galerie();i=+t.dataset.i;if(i>0){var x=G[i];G[i]=G[i-1];G[i-1]=x;LFG.saveGalerie(G);render()}break;
  case 'saveinfo':
    var I={annonceOn:document.getElementById('i-on').checked,annonce:document.getElementById('i-ann').value.trim(),tel:document.getElementById('i-tel').value.trim(),dispo:document.getElementById('i-dispo').value.trim(),email:document.getElementById('i-mail').value.trim(),zone:document.getElementById('i-zone').value.trim()};
    LFG.saveInfo(I);toast('Infos enregistrées ✓');break;
  }
});
render();
</script>
</body>
</html>
